services:
  json-merger:
    container_name: json.merger
    build:
      context: .
      args:
        # Defaults to production; set SITE_URL in .env (or -e) to override.
        SITE_URL: ${SITE_URL:-https://json-merge.online/}
    networks:
      - json.merger.net
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  json.merger.net:
    name: json.merger.net

